name: Deploy to S3

# Build the Zola site and sync it to the marketing-site bucket
# (vantage-ui.com). Auth is via GitHub OIDC into the
# vantage-demo-release-uploader role (see vantage-terraform); no
# long-lived AWS keys. The role's `site_deployer` policy is scoped to
# this bucket only.
#
# Kept named `deploy.yml` because vantage-ui's nightly workflow fires
# `gh workflow run deploy.yml --repo romaninsh/vantage-web` to refresh
# the baked-in nightly manifest after a new build.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for AWS

concurrency:
  group: "site-deploy"
  cancel-in-progress: true

env:
  # Keep in sync with the locally installed tailwindcss (brew install tailwindcss)
  TAILWIND_VERSION: 4.3.0
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::578465001751:role/vantage-demo-release-uploader
  SITE_BUCKET: vantage-ui.com
  CF_DISTRIBUTION_ID: E18KQTM4QLF7KJ

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by SHA to Node 24 releases; the AWS step mints
      # credentials that can write the site and releases buckets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zola
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: zola@0.23.4

      - name: Install Tailwind CSS standalone CLI
        run: |
          curl -sL -o /usr/local/bin/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x /usr/local/bin/tailwindcss
          tailwindcss --help | head -1

      - name: Build CSS with Tailwind
        run: tailwindcss -i css/main.css -o static/main.css --minify

      - name: Build with Zola
        # SITE_ENV=production turns on the Google tag in base.html.
        env:
          SITE_ENV: production
        run: zola build

      - name: Generate llms.txt and markdown pages
        run: python3 -I script/llms.py public

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        # Exclude examples/*.zip: those archives are published separately by the
        # vantage-ui-examples build-example-zips workflow (the vantage://
        # one-click installer downloads them from /examples/). They aren't in
        # public/, so without this exclude `--delete` would wipe them.
        # Exclude book/*: the framework mdBook, published to /book/ by
        # vantage-ui's book.yaml workflow — same reasoning.
        run: aws s3 sync public/ "s3://${SITE_BUCKET}" --delete --exclude 'examples/*.zip' --exclude 'book/*'

      - name: Set UTF-8 content types on llms files
        # The sync guesses text/markdown and text/plain with no charset, and
        # browsers then mangle the em dashes. Re-upload these few with one.
        run: |
          aws s3 cp public/ "s3://${SITE_BUCKET}" --recursive --exclude '*' --include '*.html.md' \
            --content-type 'text/markdown; charset=utf-8'
          aws s3 cp public/ "s3://${SITE_BUCKET}" --recursive --exclude '*' --include 'llms*.txt' \
            --content-type 'text/plain; charset=utf-8'

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${CF_DISTRIBUTION_ID}" --paths "/*"
