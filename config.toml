# The site title
title = "Vantage"

# The URL the site will be built for
base_url = "https://vantage-ui.com"

# The theme to use
theme = "vantage"

# Sass is not used; CSS is built by the Tailwind standalone CLI
# (see Makefile) into static/main.css.
compile_sass = false

# Whether to minify the html output
minify_html = false

# Whether to build a search index to be used later on by a JavaScript library
# build_search_index = true

# Atom feeds: site-wide at /atom.xml, plus one per section that opts in with its
# own `generate_feeds`. The blog links its section feed at /blog/atom.xml.
generate_feeds = true
feed_filenames = ["atom.xml"]

# Terms come from each post's `categories` front matter.
taxonomies = [{ name = "categories", feed = true }]



[markdown]
# Insert anchor links next to headings
insert_anchor_links = "right"

# Syntax highlighting (Zola 0.20+ syntax); "css" theme emits CSS classes
# instead of inline colours (styled in css/main.css).
[markdown.highlighting]
theme = "monokai"

[extra]
# Put all your custom variables here

# Byline on blog posts. `blog_author_url` is optional; without it the name is
# rendered as plain text.
blog_author = "Romans Malinovskis"
blog_author_url = "https://bsky.app/profile/nearly.guru"
