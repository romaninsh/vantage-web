<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="ent-escrow-title">
  <title id="ent-escrow-title">A sealed source-escrow envelope holding the Vantage UI source</title>
  <!-- the source, tucked inside -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="160" y="28" width="160" height="120" rx="8" fill="#181a26" stroke="rgba(255,255,255,0.16)"/>
    <text x="176" y="52" font-size="10" fill="#6e7186">src/</text>
    <rect x="176" y="64" width="70" height="5" rx="2.5" fill="#818cf8" opacity="0.7"/>
    <rect x="176" y="78" width="104" height="5" rx="2.5" fill="rgba(255,255,255,0.14)"/>
    <rect x="176" y="92" width="62" height="5" rx="2.5" fill="rgba(255,255,255,0.14)"/>
    <rect x="176" y="106" width="118" height="5" rx="2.5" fill="rgba(255,255,255,0.14)"/>

    <!-- envelope front -->
    <rect x="110" y="120" width="260" height="146" rx="10" fill="#12131c" stroke="rgba(255,255,255,0.16)" stroke-width="1.25"/>
    <path d="M112 126 L240 204 L368 126" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.25"/>

    <!-- wax seal with keyhole -->
    <circle cx="240" cy="204" r="28" fill="#4f46e5"/>
    <circle cx="240" cy="204" r="21" fill="none" stroke="#a5b4fc" opacity="0.55"/>
    <circle cx="240" cy="199" r="5.5" fill="#12131c"/>
    <polygon points="236.5,201 243.5,201 246,216 234,216" fill="#12131c"/>

    <text x="240" y="252" font-size="9" letter-spacing="2.5" fill="#a0a3b5" text-anchor="middle">SOURCE ESCROW</text>
  </g>
</svg>
