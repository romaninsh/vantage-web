<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="One coin die engraved with the mesh weave stamps three coins: a facade API, a sidecar or edge proxy, and an embedded data layer — all carrying the same emblem">
  <!-- ── the die: your mesh definition, engraved once ── -->
  <g>
    <rect x="344" y="14" width="32" height="22" rx="5" fill="#181a26" stroke="#ffffff29" stroke-width="1.5"/>
    <rect x="352" y="36" width="16" height="10" fill="#181a26" stroke="#ffffff29" stroke-width="1.5"/>
    <path d="M304 46 L416 46 L428 100 L292 100 Z" fill="#181a26" stroke="#ffffff29" stroke-width="1.5"/>
    <!-- the engraving: the weave emblem -->
    <g stroke="#38c6e0" stroke-width="2">
      <line x1="348" y1="63" x2="348" y2="85"/>
      <line x1="360" y1="63" x2="360" y2="85"/>
      <line x1="372" y1="63" x2="372" y2="85"/>
      <g stroke-dasharray="4 4" opacity=".9">
        <line x1="341" y1="68" x2="379" y2="68"/>
        <line x1="341" y1="74" x2="379" y2="74"/>
        <line x1="341" y1="80" x2="379" y2="80"/>
      </g>
    </g>
    <text x="276" y="78" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#a0a3b5" text-anchor="end">one die: your mesh definition</text>
  </g>

  <!-- ── the strike ── -->
  <ellipse cx="360" cy="118" rx="100" ry="12" fill="#38c6e0" opacity=".1"/>
  <ellipse cx="360" cy="118" rx="48" ry="7" fill="#38c6e0" opacity=".16"/>
  <ellipse cx="360" cy="118" rx="40" ry="8" fill="#1d2030" stroke="#38c6e0" stroke-width="1" opacity=".9"/>

  <!-- ── coin: sidecar / edge proxy ── -->
  <g transform="translate(150 222)">
    <circle r="44" fill="#12131c" stroke="#38c6e0" stroke-width="2"/>
    <circle r="37" fill="none" stroke="#38c6e0" stroke-width="1.5" stroke-dasharray="2.5 5" opacity=".65"/>
    <g stroke="#38c6e0" stroke-width="2">
      <line x1="-10" y1="-21" x2="-10" y2="1"/>
      <line x1="0"   y1="-21" x2="0"   y2="1"/>
      <line x1="10"  y1="-21" x2="10"  y2="1"/>
      <g stroke-dasharray="4 4" opacity=".9">
        <line x1="-16" y1="-16" x2="16" y2="-16"/>
        <line x1="-16" y1="-10" x2="16" y2="-10"/>
        <line x1="-16" y1="-4"  x2="16" y2="-4"/>
      </g>
    </g>
    <text y="24" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="9" letter-spacing="2" fill="#7ee3f5" opacity=".8" text-anchor="middle">&#183; MESH &#183;</text>
  </g>

  <!-- ── coin: facade API (the flagship, struck largest) ── -->
  <g transform="translate(360 212)">
    <circle r="54" fill="#12131c" stroke="#38c6e0" stroke-width="2"/>
    <circle r="46" fill="none" stroke="#38c6e0" stroke-width="1.5" stroke-dasharray="2.5 5" opacity=".65"/>
    <g stroke="#38c6e0" stroke-width="2">
      <line x1="-12" y1="-25" x2="-12" y2="1"/>
      <line x1="0"   y1="-25" x2="0"   y2="1"/>
      <line x1="12"  y1="-25" x2="12"  y2="1"/>
      <g stroke-dasharray="4 4" opacity=".9">
        <line x1="-19" y1="-19" x2="19" y2="-19"/>
        <line x1="-19" y1="-12" x2="19" y2="-12"/>
        <line x1="-19" y1="-5"  x2="19" y2="-5"/>
      </g>
    </g>
    <text y="28" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="9" letter-spacing="2" fill="#7ee3f5" opacity=".8" text-anchor="middle">&#183; MESH &#183;</text>
  </g>

  <!-- ── coin: embedded data layer ── -->
  <g transform="translate(570 222)">
    <circle r="44" fill="#12131c" stroke="#38c6e0" stroke-width="2"/>
    <circle r="37" fill="none" stroke="#38c6e0" stroke-width="1.5" stroke-dasharray="2.5 5" opacity=".65"/>
    <g stroke="#38c6e0" stroke-width="2">
      <line x1="-10" y1="-21" x2="-10" y2="1"/>
      <line x1="0"   y1="-21" x2="0"   y2="1"/>
      <line x1="10"  y1="-21" x2="10"  y2="1"/>
      <g stroke-dasharray="4 4" opacity=".9">
        <line x1="-16" y1="-16" x2="16" y2="-16"/>
        <line x1="-16" y1="-10" x2="16" y2="-10"/>
        <line x1="-16" y1="-4"  x2="16" y2="-4"/>
      </g>
    </g>
    <text y="24" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="9" letter-spacing="2" fill="#7ee3f5" opacity=".8" text-anchor="middle">&#183; MESH &#183;</text>
  </g>

  <!-- ── labels ── -->
  <g font-family="'Inter',ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <text x="150" y="288" font-size="13" font-weight="600" fill="#ecedf2">Sidecar &#183; edge proxy</text>
    <text x="150" y="305" font-size="11" fill="#6e7186">Lambda or Kubernetes</text>
    <text x="360" y="288" font-size="13" font-weight="600" fill="#ecedf2">Facade API</text>
    <text x="360" y="305" font-size="11" fill="#6e7186">cache-at-edge for your frontends</text>
    <text x="570" y="288" font-size="13" font-weight="600" fill="#ecedf2">Embedded data layer</text>
    <text x="570" y="305" font-size="11" fill="#6e7186">for mobile &amp; desktop apps</text>
  </g>
</svg>
