<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="ent-build-title">
  <title id="ent-build-title">Build sheet: five chosen modules assembled into one certified distribution</title>
  <!-- alignment guides: the modules drop onto the base build -->
  <line x1="190" y1="16" x2="190" y2="352" stroke="rgba(255,255,255,0.07)" stroke-dasharray="3 6"/>
  <line x1="450" y1="16" x2="450" y2="352" stroke="rgba(255,255,255,0.07)" stroke-dasharray="3 6"/>

  <!-- module slats (exploded stack) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g>
      <rect x="170" y="16" width="300" height="44" rx="9" fill="#181a26" stroke="rgba(255,255,255,0.16)"/>
      <text x="188" y="42" font-size="11" font-weight="600" fill="#818cf8">01</text>
      <text x="214" y="36" font-size="11.5" fill="#ecedf2">Your datasources</text>
      <text x="214" y="50" font-size="8" fill="#6e7186">CDC for Oracle · SQL Server · Db2</text>
      <path d="M440 37 l5 5 l9 -11" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="170" y="74" width="300" height="44" rx="9" fill="#181a26" stroke="rgba(255,255,255,0.16)"/>
      <text x="188" y="100" font-size="11" font-weight="600" fill="#818cf8">02</text>
      <text x="214" y="94" font-size="11.5" fill="#ecedf2">Your widgets</text>
      <text x="214" y="108" font-size="8" fill="#6e7186">ours or your team's, compiled in</text>
      <path d="M440 95 l5 5 l9 -11" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="170" y="132" width="300" height="44" rx="9" fill="#181a26" stroke="rgba(255,255,255,0.16)"/>
      <text x="188" y="158" font-size="11" font-weight="600" fill="#818cf8">03</text>
      <text x="214" y="152" font-size="11.5" fill="#ecedf2">Your telemetry</text>
      <text x="214" y="166" font-size="8" fill="#6e7186">your account — or none</text>
      <path d="M440 153 l5 5 l9 -11" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="170" y="190" width="300" height="44" rx="9" fill="#181a26" stroke="rgba(255,255,255,0.16)"/>
      <text x="188" y="216" font-size="11" font-weight="600" fill="#818cf8">04</text>
      <text x="214" y="210" font-size="11.5" fill="#ecedf2">Your install domain</text>
      <text x="214" y="224" font-size="8" fill="#6e7186">vantage:// allowlist you control</text>
      <path d="M440 211 l5 5 l9 -11" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="170" y="248" width="300" height="44" rx="9" fill="#181a26" stroke="rgba(255,255,255,0.16)"/>
      <text x="188" y="274" font-size="11" font-weight="600" fill="#818cf8">05</text>
      <text x="214" y="268" font-size="11.5" fill="#ecedf2">Your data models</text>
      <text x="214" y="282" font-size="8" fill="#6e7186">typed in Rust, shared as a crate</text>
      <path d="M440 269 l5 5 l9 -11" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- the assembled build -->
    <rect x="150" y="336" width="340" height="72" rx="12" fill="#181a26" stroke="#6366f1" stroke-width="1.5"/>
    <text x="320" y="368" font-size="13" font-weight="600" letter-spacing="3" fill="#ecedf2" text-anchor="middle">YOUR DISTRIBUTION</text>
    <text x="320" y="388" font-size="8.5" letter-spacing="1" fill="#6e7186" text-anchor="middle">one signed build of Vantage UI</text>

    <!-- certification stamp -->
    <g transform="rotate(-8 524 336)">
      <circle cx="524" cy="336" r="58" fill="#0b0b10"/>
      <circle cx="524" cy="336" r="58" fill="rgba(99,102,241,0.10)" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
      <circle cx="524" cy="336" r="48" fill="none" stroke="#818cf8" opacity="0.45"/>
      <text x="524" y="318" font-size="7" fill="#6e7186" text-anchor="middle" textLength="42" lengthAdjust="spacing">VANTAGE</text>
      <text x="524" y="340" font-size="10.5" font-weight="700" fill="#a5b4fc" text-anchor="middle" textLength="68" lengthAdjust="spacingAndGlyphs">CERTIFIED</text>
      <text x="524" y="358" font-size="7" fill="#6e7186" text-anchor="middle" textLength="62" lengthAdjust="spacingAndGlyphs">FOR YOUR FLEET</text>
    </g>
  </g>
</svg>
